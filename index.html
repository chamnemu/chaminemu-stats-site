
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ちゃみねむ | 配信実績</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #101017;
      color: #f5f3ff;
      font-family: sans-serif;
      line-height: 1.7;
    }
    main {
      max-width: 900px;
      margin: auto;
      padding: 64px 20px;
    }
    .eyebrow { color: #b7a1ff; }
    h1 { font-size: clamp(36px, 7vw, 64px); margin: 8px 0; }
    h2 { margin-top: 48px; }
    .muted { color: #b5b3c5; }
    .card {
      background: #1d1c29;
      border: 1px solid #353149;
      border-radius: 18px;
      padding: 24px;
      margin-top: 20px;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    a {
      color: #e6dcff;
      text-decoration: none;
      background: #33264d;
      border-radius: 12px;
      padding: 10px 16px;
    }
    a:hover { background: #513b79; }
    .value { font-size: 32px; font-weight: bold; }
    footer { margin-top: 64px; color: #9894a8; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">STREAMER PORTFOLIO</div>
    <h1>ちゃみねむ</h1>
    <p class="muted">配信活動・実績・成長記録</p>

    <h2>配信データ</h2>
    <div class="card">
      <p class="muted">Twitch 週間平均視聴者数</p>
      <div class="value">準備中</div>
      <p class="muted">
        配信中の視聴者数を定期的に記録しています。
        今後、自動更新グラフを表示します。
      </p>
    </div>

    <h2>公式リンク</h2>
    <div class="links">
      <a href="https://www.twitch.tv/chaminemu">Twitch</a>
      <a href="https://www.youtube.com/@chaminemu">YouTube</a>
      <a href="https://x.com/chaminemu">X</a>
      <a href="https://www.tiktok.com/@chaminemu">TikTok</a>
      <a href="https://lit.link/chaminemu">LitLink</a>
    </div>

    <h2>活動実績</h2>
    <div class="card">
      <p>
        Twitchを中心とした配信活動の記録を、
        このサイトにまとめていきます。
      </p>
      <p class="muted">
        視聴者数の推移・週間平均・成長グラフを順次公開予定。
      </p>
    </div>

    <footer>© ちゃみねむ</footer>
  </main>
</body>
</html>
