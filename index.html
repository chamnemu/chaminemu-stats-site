
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ちゃみねむ | 配信実績</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #101017;
      color: #f5f3ff;
      font-family: sans-serif;
      line-height: 1.7;
    }
    main {
      max-width: 900px;
      margin: auto;
      padding: 64px 20px;
    }
    .eyebrow { color: #b7a1ff; }
    h1 { font-size: clamp(36px, 7vw, 64px); margin: 8px 0; }
    h2 { margin-top: 48px; }
    .muted { color: #b5b3c5; }
    .card {
      background: #1d1c29;
      border: 1px solid #353149;
      border-radius: 18px;
      padding: 24px;
      margin-top: 20px;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    a {
      color: #e6dcff;
      text-decoration: none;
      background: #33264d;
      border-radius: 12px;
      padding: 10px 16px;
    }
    a:hover { background: #513b79; }
    .value { font-size: 32px; font-weight: bold; }
    footer { margin-top: 64px; color: #9894a8; }

    .chart-wrap {
      position: relative;
      height: 300px;
      margin-top: 24px;
    }
    canvas { max-width: 100%; }
    .status { font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">STREAMER PORTFOLIO</div>
    <h1>ちゃみねむ</h1>
    <p class="muted">配信活動・実績・成長記録</p>

    <h2>配信データ</h2>
    <div class="card">
      <p class="muted">Twitch 記録期間の平均同時視聴者数</p>
      <div class="value" id="average">読み込み中...</div>
      <p class="muted status" id="status">
        Twitchの記録データを取得しています。
      </p>

      <div class="chart-wrap">
        <canvas id="viewerChart"></canvas>
      </div>

      <p class="muted">
        配信中の同時視聴者数を定期的に記録し、
        グラフを自動更新しています。
      </p>
    </div>

    <h2>公式リンク</h2>
    <div class="links">
      <a href="https://www.twitch.tv/chaminemu">Twitch</a>
      <a href="https://www.youtube.com/@chaminemu">YouTube</a>
      <a href="https://x.com/chaminemu">X</a>
      <a href="https://www.tiktok.com/@chaminemu">TikTok</a>
      <a href="https://lit.link/chaminemu">LitLink</a>
    </div>

    <h2>活動実績</h2>
    <div class="card">
      <p>
        Twitchを中心とした配信活動の記録を、
        このサイトにまとめています。
      </p>
      <p class="muted">
        視聴者数の推移を自動更新しています。
        週間平均や成長比較も順次追加予定です。
      </p>
    </div>

    <footer>© ちゃみねむ</footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
  <script>
    const API_URL =
      "https://chaminemu-stats-worker.chami2m2.workers.dev/api/viewers";

    let viewerChart = null;

    async function loadViewerStats() {
      const averageElement = document.getElementById("average");
      const statusElement = document.getElementById("status");

      try {
        if (typeof Chart === "undefined") {
          throw new Error("グラフ用ライブラリを読み込めませんでした");
        }

        const response = await fetch(API_URL, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("データ取得エラー: " + response.status);
        }

        const raw = await response.json();

        if (!Array.isArray(raw)) {
          throw new Error("データ形式が正しくありません");
        }

        const data = raw
          .filter(item =>
            Number.isFinite(Number(item.viewer_count)) &&
            item.viewer_count !== null &&
            Number.isFinite(Date.parse(item.sampled_at))
          )
          .sort((a, b) =>
            new Date(a.sampled_at) - new Date(b.sampled_at)
          );

        if (data.length === 0) {
          averageElement.textContent = "まだ記録がありません";
          statusElement.textContent =
            "配信中にデータが記録されると表示されます。";
          return;
        }

        const counts = data.map(item =>
          Number(item.viewer_count)
        );

        const average =
          counts.reduce((sum, value) => sum + value, 0) /
          counts.length;

        averageElement.textContent =
          average.toFixed(1) + " 人";

        const latest = data[data.length - 1];

        const updatedAt = new Date(
          latest.sampled_at
        ).toLocaleString("ja-JP", {
          timeZone: "Asia/Tokyo"
        });

        statusElement.textContent =
          "最新記録: " + updatedAt +
          " / " + data.length + "件のサンプル";

        const labels = data.map(item =>
          new Date(item.sampled_at).toLocaleString("ja-JP", {
            timeZone: "Asia/Tokyo",
            month: "numeric",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit"
          })
        );

        const ctx = document.getElementById(
          "viewerChart"
        ).getContext("2d");

        if (viewerChart) {
          viewerChart.destroy();
        }

        viewerChart = new Chart(ctx, {
          type: "line",
          data: {
            labels,
            datasets: [{
              label: "同時視聴者数",
              data: counts,
              borderColor: "#b7a1ff",
              backgroundColor: "rgba(183,161,255,0.12)",
              fill: true,
              tension: 0.25,
              pointRadius: data.length > 100 ? 0 : 2,
              pointHoverRadius: 5
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
              intersect: false,
              mode: "index"
            },
            plugins: {
              legend: {
                labels: { color: "#f5f3ff" }
              }
            },
            scales: {
              x: {
                ticks: {
                  color: "#b5b3c5",
                  maxTicksLimit: 6
                },
                grid: {
                  color: "#353149"
                }
              },
              y: {
                beginAtZero: true,
                ticks: {
                  color: "#b5b3c5",
                  precision: 0
                },
                grid: {
                  color: "#353149"
                }
              }
            }
          }
        });

      } catch (error) {
        console.error(error);
        averageElement.textContent = "取得できませんでした";
        statusElement.textContent =
          "データの読み込みに失敗しました。";
      }
    }

    loadViewerStats();
    setInterval(loadViewerStats, 60000);
  </script>
</body>
</html>
